name: CI

on:
  push:
    branches: [main]
  pull_request:

# El deploy lo hace Cloudflare Workers Builds al recibir el push; este workflow
# solo mantiene la única puerta automática que tiene el repo: astro check.
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Typecheck
        run: npx astro check
      - name: Build
        run: npm run build
